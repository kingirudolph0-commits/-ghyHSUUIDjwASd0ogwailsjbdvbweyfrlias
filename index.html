<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Watch</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;font:14px system-ui;background:#111;color:#eee;display:flex;flex-direction:column;height:100vh}
  header{display:flex;flex-wrap:wrap;gap:8px;padding:8px;background:#1b1b1b}
  input{flex:1;min-width:120px;padding:10px;border-radius:8px;border:1px solid #333;background:#000;color:#eee}
  button{padding:10px 14px;border-radius:8px;border:0;background:#3ea6ff;color:#000;font-weight:600;cursor:pointer}
  button.ghost{background:#333;color:#ddd}
  iframe{flex:1;border:0;width:100%;background:#000;min-height:0}
  #results{display:none;flex:1;overflow:auto;padding:8px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
  #results.on{display:grid}
  .card{cursor:pointer;background:#1b1b1b;border-radius:8px;overflow:hidden}
  .card:hover{outline:2px solid #3ea6ff}
  .card img{width:100%;display:block;aspect-ratio:16/9;object-fit:cover;background:#000}
  .card .t{padding:8px;font-weight:600;line-height:1.3;max-height:3.9em;overflow:hidden}
  .card .c{padding:0 8px 8px;color:#999;font-size:12px}
  #msg{padding:8px;color:#f88}
</style>
</head>
<body>
<header>
  <input id="q" placeholder="Search YouTube…">
  <button id="search">Search</button>
  <input id="link" placeholder="…or paste a YouTube / Spotify link or video ID">
  <button id="go" class="ghost">Play link</button>
</header>
<div id="msg"></div>
<div id="results"></div>
<iframe id="frame" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen></iframe>
<script>
const frame=document.getElementById("frame"), msg=document.getElementById("msg"),
      results=document.getElementById("results"), q=document.getElementById("q"),
      link=document.getElementById("link");
let KEY=localStorage.getItem("ytkey")||"";

function ytId(s){
  s=s.trim();
  if(/^[\w-]{11}$/.test(s)) return s;
  try{
    const u=new URL(s);
    if(u.hostname==="youtu.be") return u.pathname.slice(1);
    if(u.searchParams.get("v")) return u.searchParams.get("v");
    const m=u.pathname.match(/\/embed\/([\w-]{11})/); if(m) return m[1];
  }catch(e){}
  return null;
}
function ytList(s){ try{ return new URL(s).searchParams.get("list"); }catch(e){ return null; } }

function openYouTube(url){
  const id=ytId(url)||url;
  if(/^[\w-]{11}$/.test(id)){ playEmbed("https://www.youtube.com/embed/"+id+"?autoplay=1"); return; }
  window.open(url,"ytplayer","popup=yes,width=1024,height=640");
}
function playEmbed(src){ msg.textContent=""; results.classList.remove("on"); frame.src=src; }

function playLink(){
  const v=link.value.trim(); if(!v) return;
  const id=ytId(v);
  if(id){ openYouTube("https://www.youtube.com/watch?v="+id); return; }
  const list=ytList(v);
  if(list){ openYouTube("https://www.youtube.com/playlist?list="+list); return; }
  if(/^https?:\/\/open\.spotify\.com\//.test(v)){
    playEmbed(v.replace("open.spotify.com/","open.spotify.com/embed/")); return;
  }
  msg.textContent="Not a YouTube or Spotify link/ID";
}

async function search(){
  const term=q.value.trim(); if(!term) return;
  if(!KEY){
    KEY=prompt("Paste your YouTube Data API key (saved locally only):")||"";
    if(!KEY) return;
    localStorage.setItem("ytkey",KEY);
  }
  msg.textContent="Searching…"; results.classList.remove("on");
  try{
    const u="https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=12&q="
      +encodeURIComponent(term)+"&key="+encodeURIComponent(KEY);
    const r=await fetch(u);
    if(!r.ok){
      let e="HTTP "+r.status; try{ e=(await r.json()).error.message||e; }catch(_){}
      msg.textContent="Search failed: "+e+(r.status===403?" (check key restrictions / quota)":"");
      return;
    }
    const data=await r.json();
    render((data.items||[]).map(i=>({id:i.id.videoId,s:i.snippet})));
  }catch(e){ msg.textContent="Search failed: "+e; }
}
function render(items){
  results.textContent="";
  if(!items.length){ msg.textContent="No results"; return; }
  msg.textContent="";
  for(const it of items){
    const card=document.createElement("div"); card.className="card";
    const img=document.createElement("img");
    img.loading="lazy";
    img.src=it.s.thumbnails&&(it.s.thumbnails.medium||it.s.thumbnails.default).url||"";
    img.alt="";
    const t=document.createElement("div"); t.className="t"; t.textContent=it.s.title;
    const c=document.createElement("div"); c.className="c"; c.textContent=it.s.channelTitle;
    card.append(img,t,c);
    card.onclick=()=>openYouTube("https://www.youtube.com/watch?v="+it.id);
    results.append(card);
  }
  results.classList.add("on");
}
document.getElementById("search").onclick=search;
document.getElementById("go").onclick=playLink;
q.addEventListener("keydown",e=>{ if(e.key==="Enter") search(); });
link.addEventListener("keydown",e=>{ if(e.key==="Enter") playLink(); });
document.querySelector("header").addEventListener("contextmenu",e=>{
  e.preventDefault(); const k=prompt("YouTube Data API key (blank clears):",KEY);
  if(k!==null){ KEY=k.trim(); localStorage.setItem("ytkey",KEY); }
});
link.value=localStorage.getItem("last")||"";
link.addEventListener("change",()=>localStorage.setItem("last",link.value));
console.assert(ytId("https://youtu.be/dQw4w9WgXcQ")==="dQw4w9WgXcQ","yt short url");
console.assert(ytId("dQw4w9WgXcQ")==="dQw4w9WgXcQ","yt id");
console.assert(ytId("https://www.youtube.com/watch?v=dQw4w9WgXcQ&list=PL123")==="dQw4w9WgXcQ","yt watch url");
</script>
</body>
</html>
